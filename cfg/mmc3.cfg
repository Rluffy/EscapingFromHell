# MMC3 (mapper 4): 128 KB PRG (16 x 8 KB), 128 KB CHR, 8 KB PRG-RAM at $6000.
# PRG mode 0: $C000-$FFFF = banks 14,15 (fixed), $8000 = R6 (switchable 8 KB), $A000 = R7 (bank 1, unused so far).
# Boss code lives in BANK0..BANK5 (all at $8000); docs/TECH.md "PRG-Banking".
MEMORY {
    ZP:      file = "",   start = $0002, size = $00FE, type = rw, define = yes;
    OAM:     file = "",   start = $0200, size = $0100, type = rw;
    DBG:     file = "",   start = $0300, size = $0030, type = rw;   # test-visible RAM
    RAM:     file = "",   start = $0330, size = $02D0, type = rw, define = yes;
    CSTACK:  file = "",   start = $0600, size = $0200, type = rw, define = yes;
    SAVE:    file = "",   start = $6000, size = $2000, type = rw;   # battery PRG-RAM

    HEADER:  file = %O,   start = $0000, size = $0010, fill = yes;
    # Banks 0-13 (112 KB) in file order: 0..5 named, 6..13 reserved fill.
    BANK0:   file = %O,   start = $8000, size = $2000, fill = yes;
    BANK1:   file = %O,   start = $8000, size = $2000, fill = yes;
    BANK2:   file = %O,   start = $8000, size = $2000, fill = yes;
    BANK3:   file = %O,   start = $8000, size = $2000, fill = yes;
    BANK4:   file = %O,   start = $8000, size = $2000, fill = yes;
    BANK5:   file = %O,   start = $8000, size = $2000, fill = yes;
    BANKS:   file = %O,   start = $8000, size = $10000, fill = yes;   # banks 6..13, bank 13 = "none" at reset
    ROMF:    file = %O,   start = $C000, size = $3FFA, fill = yes, define = yes;
    ROMV:    file = %O,   start = $FFFA, size = $0006, fill = yes;
    CHR:     file = %O,   start = $0000, size = $20000, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    OAM:      load = OAM,    type = bss, align = $100;
    DEBUG:    load = DBG,    type = bss;
    BSS:      load = RAM,    type = bss, define = yes;
    SAVE:     load = SAVE,   type = bss, optional = yes;
    HEADER:   load = HEADER, type = ro;
    BANK0:    load = BANK0,  type = ro, optional = yes;
    BANK1:    load = BANK1,  type = ro, optional = yes;
    BANK2:    load = BANK2,  type = ro, optional = yes;
    BANK3:    load = BANK3,  type = ro, optional = yes;
    BANK4:    load = BANK4,  type = ro, optional = yes;
    BANK5:    load = BANK5,  type = ro, optional = yes;
    STARTUP:  load = ROMF,   type = ro;
    CODE:     load = ROMF,   type = ro;
    RODATA:   load = ROMF,   type = ro;
    DATA:     load = ROMF,   run = RAM, type = rw, define = yes;
    VECTORS:  load = ROMV,   type = ro;
    CHARS:    load = CHR,    type = ro;
}
